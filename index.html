<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>곽민선 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =========================================================
   디자인 토큰 (색상은 여기서만 바꾸면 전체에 적용됩니다)
   ========================================================= */
:root{
  color-scheme: light;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f1f2f5; --border:#e5e7ec;
  --text:#11131c; --text-2:#525665; --muted:#8a8e9b;
  --accent:#3b5bfd; --accent-ink:#ffffff; --accent-soft:#eef1ff;
  --grid:#eceef2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --neutral:#a3a6b0;
  --good:#0a8a0a; --crit:#d03b3b;
  --shadow:0 1px 2px rgba(17,19,28,.04),0 6px 20px rgba(17,19,28,.05);
  --radius:16px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e0f13; --surface:#16171c; --surface-2:#1e2027; --border:#2a2c35;
    --text:#f1f2f5; --text-2:#b6b9c4; --muted:#7e8291;
    --accent:#6f86ff; --accent-ink:#0e0f13; --accent-soft:#222a4f;
    --grid:#24262e;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --neutral:#6b6e78; --good:#2fbf2f; --crit:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e0f13; --surface:#16171c; --surface-2:#1e2027; --border:#2a2c35;
  --text:#f1f2f5; --text-2:#b6b9c4; --muted:#7e8291;
  --accent:#6f86ff; --accent-ink:#0e0f13; --accent-soft:#222a4f;
  --grid:#24262e;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --neutral:#6b6e78; --good:#2fbf2f; --crit:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- 로그인 ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),
             radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--s3) 14%,transparent),transparent 60%),var(--bg)}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 28px;box-shadow:var(--shadow)}
.gate-logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--s3));display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;margin-bottom:20px}
.gate h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
.gate p{margin:0 0 24px;color:var(--text-2);font-size:14px}
.field{position:relative}
.field input{width:100%;height:52px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);padding:0 52px 0 16px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.eye{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--muted)}
.btn-primary{width:100%;height:52px;margin-top:12px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer;transition:filter .15s}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:disabled{opacity:.6;cursor:wait}
.gate-err{min-height:20px;margin-top:12px;color:var(--crit);font-size:13px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.gate-foot{margin-top:20px;font-size:12px;color:var(--muted)}

/* ---------- 앱 레이아웃 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1240px;margin:0 auto;padding:14px 24px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--s3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.brand h1{font-size:18px;margin:0;letter-spacing:-.02em;white-space:nowrap}
.avatar{background:var(--surface-2)!important;overflow:hidden;padding:0;box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.gate-logo.avatar{width:84px;height:84px;border-radius:50%}
.brand-mark.avatar{width:40px;height:40px;border-radius:50%}
.sns-row{display:flex;gap:6px;margin-left:4px}
.sns{height:30px;padding:0 10px 0 8px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);transition:border-color .15s,transform .15s}
.sns:hover{transform:translateY(-1px)}
.sns svg{width:15px;height:15px}
.sns.instagram svg{color:#d62976} .sns.instagram:hover{border-color:#d62976}
.sns.youtube svg{color:#ff0000} .sns.youtube:hover{border-color:#ff0000}
@media (max-width:760px){ .sns{padding:0;width:30px;justify-content:center} .sns .t{display:none} .brand{flex:1 1 auto} .brand h1{font-size:15px;overflow:hidden;text-overflow:ellipsis} .brand-mark.avatar{width:34px;height:34px} .actions .icon-btn{height:32px;min-width:32px;padding:0 7px} .actions{gap:4px} .sns-row{gap:4px;margin-left:0} }
.meta{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.actions{display:flex;gap:6px}
.icon-btn{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.icon-btn:hover{color:var(--text);border-color:color-mix(in srgb,var(--text) 25%,var(--border))}
.icon-btn svg{width:16px;height:16px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{max-width:1240px;margin:0 auto;padding:10px 24px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:10px 14px 12px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text-2)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab .pill{margin-left:6px;font-size:11px;padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}
.tab .err-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--crit);margin-left:6px;vertical-align:3px}

main{max-width:1240px;margin:0 auto;padding:24px 24px 64px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:26px;letter-spacing:-.03em}
.page-head .sub{color:var(--text-2);font-size:14px;margin-top:2px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.kpi .label{font-size:13px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .label .dot{width:8px;height:8px;border-radius:3px;flex:none}
.kpi .value{font-size:30px;font-weight:750;letter-spacing:-.03em;margin-top:6px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .value small{font-size:16px;font-weight:600;color:var(--text-2);margin-left:2px}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 92%,#000) ,color-mix(in srgb,var(--accent) 70%,var(--s3)));border-color:transparent;color:#fff}
.kpi.hero .label,.kpi.hero .foot,.kpi.hero .value small{color:rgba(255,255,255,.85)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:12px;padding:1px 6px;border-radius:6px}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.delta.down{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.delta.flat{color:var(--muted);background:var(--surface-2)}

.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:16px;letter-spacing:-.01em}
.card-h .hint{font-size:12px;color:var(--muted)}
.chart{position:relative;height:280px}
.chart.tall{height:340px}
.plot{position:absolute;inset:0}
.plot svg{display:block;overflow:visible;touch-action:pan-y}
.plot .ax{font-size:11px;fill:var(--muted);font-family:var(--font)}
.plot .ax.lab{fill:var(--text-2);font-size:12px}
.plot .ax.val{fill:var(--text);font-weight:600}
.tip{position:absolute;display:none;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;min-width:140px;z-index:5}
.tip-t{font-weight:700;margin-bottom:4px;color:var(--text)}
.tip-r{display:flex;align-items:center;gap:6px;color:var(--text-2);white-space:nowrap}
.tip-r i{width:8px;height:8px;border-radius:2px;flex:none}
.tip-r b{margin-left:auto;padding-left:12px;color:var(--text);font-variant-numeric:tabular-nums}
.tip-f{margin-top:4px;padding-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:-4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.line{height:3px;border-radius:2px;width:14px}

.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--accent-soft);color:var(--text);font-size:14px;margin-bottom:14px;white-space:pre-line}
.notice svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--accent)}
.notice.warn{background:color-mix(in srgb,var(--s4) 14%,var(--surface))}
.notice.warn svg{color:var(--s4)}
.notice.err{background:color-mix(in srgb,var(--crit) 10%,var(--surface))}
.notice.err svg{color:var(--crit)}
.notice .grow{flex:1;min-width:0}
.notice b{display:block;margin-bottom:2px}

/* 비율 막대 */
.ratio{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 16px}
.ratio div{height:100%}
.ratio-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ratio-list li{display:flex;align-items:center;gap:10px;font-size:14px}
.ratio-list i{width:10px;height:10px;border-radius:3px;flex:none}
.ratio-list .n{margin-left:auto;font-weight:700}
.ratio-list .p{color:var(--muted);width:48px;text-align:right;font-size:13px}

/* 표 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);padding:0 12px;font-size:14px;outline:none}
.toolbar input{flex:1;min-width:160px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;max-height:560px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td.wrap{white-space:normal;min-width:140px;max-width:280px}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--text-2);font-size:12.5px;z-index:1}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;background:var(--surface-2);position:sticky;bottom:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--text)}
.badge i{width:7px;height:7px;border-radius:50%}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--s4) 20%,transparent);color:var(--text);margin-left:6px}
.count-line{font-size:12px;color:var(--muted);margin-top:8px}

/* 캘린더 */
.cal-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.cal h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.cal h3 .yr{font-size:12px;color:var(--muted);font-weight:500}
.cal h3 .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0 6px}
.cal-dow.sun{color:var(--crit)} .cal-dow.sat{color:var(--s1)}
.cal-cell{min-height:86px;border-radius:10px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:default;border:1px solid transparent}
.cal-cell.out{opacity:.38}
.cal-cell.today{border-color:var(--accent);background:var(--accent-soft)}
.cal-cell.has{cursor:pointer}
.cal-cell .d{font-size:12px;font-weight:600;color:var(--text-2)}
.cal-cell.sun .d{color:var(--crit)} .cal-cell.sat .d{color:var(--s1)}
.cal-cell.today .d{color:var(--accent)}
.ev{font-size:11px;line-height:1.3;padding:2px 5px;border-radius:5px;background:var(--surface);border-left:3px solid var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-more{font-size:10.5px;color:var(--muted)}
.up-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.up-list li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.up-date{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--surface);padding:6px 0;line-height:1.1}
.up-date b{display:block;font-size:18px}
.up-date span{font-size:11px;color:var(--muted)}
.up-txt{font-size:14px;white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.up-txt .rel{display:block;font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--border);border-radius:12px}

/* 확정건 카드 */
.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.deal{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;min-width:0}
.deal .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.deal .b{font-weight:700;font-size:16px}
.deal .amt{font-weight:750;font-size:18px;white-space:nowrap}
.deal .p{font-size:13px;color:var(--text-2);overflow-wrap:anywhere}
.deal .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.deal .links{display:flex;gap:8px;margin-top:auto}
.link-btn{font-size:13px;font-weight:600;padding:6px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--border);text-decoration:none;color:var(--text)}
.link-btn:hover{border-color:var(--accent);color:var(--accent)}

/* 검증 */
details.verify{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;margin-bottom:14px}
details.verify summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.verify summary::-webkit-details-marker{display:none}
details.verify summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.verify[open] summary::after{content:"▴"}
.v-list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;font-size:13.5px}
.v-list li{display:flex;gap:8px;align-items:flex-start}
.ok{color:var(--good);font-weight:700} .ng{color:var(--crit);font-weight:700} .wn{color:var(--s4);font-weight:700}

/* 연결 상태 */
.status-list{display:grid;gap:8px}
.status-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;flex-wrap:wrap}
.status-row .sd{width:8px;height:8px;border-radius:50%;flex:none}
.status-row .st{color:var(--muted);font-size:12.5px}
.status-row label{margin-left:auto}
.upload-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--border);cursor:pointer}
.upload-btn:hover{border-color:var(--accent);color:var(--accent)}
.upload-btn input{display:none}

.loading{padding:60px 0;text-align:center;color:var(--muted)}
.skeleton{height:110px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:70vh;overflow:auto;box-shadow:var(--shadow)}
.modal h4{margin:0 0 12px;font-size:17px}
@media (min-width:700px){.modal-bg{align-items:center}}

/* ---------- 반응형 ---------- */
@media (max-width:1024px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
}
@media (max-width:760px){
  .topbar-in{padding:12px 16px 0}
  .tabs{padding:6px 12px 0}
  main{padding:18px 16px 48px}
  .meta{order:3;width:100%;margin-left:0}
  .actions{margin-left:auto}
  .icon-btn .t{display:none}
  .g2,.cal-wrap{grid-template-columns:1fr}
  .kpis{gap:10px}
  .kpi{padding:14px 16px}
  .kpi .value{font-size:22px}
  .page-head h2{font-size:22px}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2,'0');
const norm = s => String(s||'').replace(/\s+/g,'').toLowerCase();
/* 빈 셀·대시(-)는 '값 없음'으로 통일 */
const clean = v => { v = String(v ?? '').replace(/ /g,' ').trim(); return /^[-–—]+$/.test(v) ? '' : v; };
const fmt = n => (n==null||isNaN(n)) ? '–' : Math.round(n).toLocaleString('ko-KR');
function wonShort(n){
  if(n==null) return '–';
  const a=Math.abs(n);
  if(a>=1e8) return (n/1e8).toFixed(a%1e8===0?0:1)+'억';
  if(a>=1e4) return Math.round(n/1e4).toLocaleString('ko-KR')+'만';
  return fmt(n);
}
const won = n => n==null ? '–' : '₩'+fmt(n);
function numShort(n){
  if(n==null) return '–';
  const a=Math.abs(n);
  if(a>=1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'')+'억';
  if(a>=1e4) return (n/1e4).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'만';
  return fmt(n);
}
/* 숫자 인식: "₩10,000,000" "1,058,114" "31818" "1,000만" → 숫자 / 그 외 → null */
function parseNum(s){
  s = clean(s); if(!s) return null;
  if(!/^[-+]?[₩$]?\s*[\d,]+(\.\d+)?\s*(원|만원|만)?$/.test(s)) return null;
  let v = parseFloat(s.replace(/[^\d.\-]/g,''));
  if(isNaN(v)) return null;
  if(/만/.test(s)) v *= 10000;
  return v;
}
/* 날짜 인식: 26.1.14 / 26.02.4 / 2026-06-22 / 2026.6.22 / 2026년 6월 22일 */
function mkDate(y,m,d){
  if(m<1||m>12||d<1||d>31) return null;
  return { y, m, d, key:`${y}-${p2(m)}-${p2(d)}`, ym:`${y}-${p2(m)}`, t:new Date(y,m-1,d).getTime() };
}
function parseDate(s){
  s = clean(s); if(!s) return null;
  const m = s.match(/^(\d{2,4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
  if(!m) return null;
  let y=+m[1]; if(y<100) y+=2000;
  return mkDate(y,+m[2],+m[3]);
}
const todayDate = () => { const n=new Date(); return mkDate(n.getFullYear(), n.getMonth()+1, n.getDate()); };
function ymAdd(ym,k){ let [y,m]=ym.split('-').map(Number); m+=k; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${p2(m)}`; }
function ymRange(a,b){ const out=[]; let c=a; while(c<=b && out.length<36){ out.push(c); c=ymAdd(c,1); } return out; }
function ymLabels(list){ const ys=new Set(list.map(x=>x.slice(0,4))); return list.map(x=> ys.size>1 ? `${x.slice(2,4)}.${+x.slice(5)}` : `${+x.slice(5)}월`); }

/* CSV 파서 — 따옴표 안의 줄바꿈·쉼표(병합셀 메모 등)까지 정확히 처리 */
function parseCSV(text){
  text = text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
/* 한글 인코딩 — UTF-8 우선, 깨지면 EUC-KR(엑셀 저장 CSV)로 다시 읽기 */
function decodeBuffer(buf){
  const b = new Uint8Array(buf);
  try { return new TextDecoder('utf-8',{fatal:true}).decode(b); }
  catch(e){ return new TextDecoder('euc-kr').decode(b); }
}
/* 여러 단계 헤더 대응: 위쪽 제목/빈 줄을 건너뛰고 진짜 헤더 줄을 찾음 */
function findHeader(rows, must){
  for(let i=0;i<Math.min(rows.length,40);i++){
    const n = rows[i].map(norm);
    if(must.every(k => n.some(c => c===norm(k) || c.startsWith(norm(k))))) return i;
  }
  return -1;
}
function colIdx(H, names){
  const n = H.map(norm);
  for(const k of names){ const i=n.indexOf(norm(k)); if(i>=0) return i; }
  for(const k of names){ const i=n.findIndex(c=>c.startsWith(norm(k))); if(i>=0) return i; }
  for(const k of names){ const i=n.findIndex(c=>c.includes(norm(k))); if(i>=0) return i; }
  return -1;
}

    const titles=[];
    rows.forEach((r,i)=>r.forEach((c,j)=>{
      const m = clean(c).match(/^(\d{1,2})\s*월\s*(스케줄|일정)/);
      if(m) titles.push({row:i,col:j,month:+m[1]});
    }));
    if(!titles.length) throw new Error('"N월 스케줄" 제목을 찾지 못했어요.');
    titles.sort((a,b)=>a.row-b.row||a.col-b.col);

    const firstRow = titles[0].row;
    const notes=[];
    for(let i=0;i<firstRow;i++) rows[i].forEach(c=>{ const v=clean(c); if(v) notes.push(v); });

    // 시트에 연도가 없으므로 오늘과 가장 가까운 연도로 추정, 월이 줄어들면 다음 해
    const now=new Date(), Y=now.getFullYear();
    let best=Y, bd=Infinity;
    for(const y of [Y-1,Y,Y+1]){ const d=Math.abs(new Date(y,titles[0].month-1,15)-now); if(d<bd){bd=d;best=y;} }
    let y=best, prev=titles[0].month;
    titles.forEach((t,k)=>{ if(k>0 && t.month<prev) y++; t.year=y; prev=t.month; });

    const events = new Map();  // 'YYYY-MM-DD' → [텍스트]
    const dateRe=/^(\d{1,2})\s*\/\s*(\d{1,2})$/;
    let dateCells=0;
    const blocks = titles.map(t=>{
      const next = titles.find(o=>o.col===t.col && o.row>t.row);
      const end = next ? next.row : rows.length;
      const cell = (i,k)=> clean((rows[i]||[])[t.col+k]);
      const dateRows=[];
      for(let i=t.row+1;i<end;i++){
        let hit=0; for(let k=0;k<7;k++) if(dateRe.test(cell(i,k))) hit++;
        if(hit>=4) dateRows.push(i);
      }
      const weeks = dateRows.map((dr,wi)=>{
        const stop = dateRows[wi+1] ?? end;
        const week=[];
        for(let k=0;k<7;k++){
          const m = cell(dr,k).match(dateRe);
          if(!m){ week.push(null); continue; }
          const mo=+m[1], d=+m[2];
          let yy=t.year;
          if(t.month===12 && mo===1) yy++;
          if(t.month===1 && mo===12) yy--;
          const dt=mkDate(yy,mo,d); dateCells++;
          for(let i=dr+1;i<stop;i++){
            const v=cell(i,k); if(!v) continue;
            const list=events.get(dt.key)||[];
            v.split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>{ if(!list.includes(s)) list.push(s); });
            events.set(dt.key,list);
          }
          week.push({...dt, inMonth: mo===t.month, dow:k});
        }
        return week;
      });
      return { year:t.year, month:t.month, weeks };
    });
    return { notes, blocks, events, dateCells };
  },

  /* --- 광고 문의 --- */
  inquiry(rows){
    const hi = findHeader(rows,['유형','브랜드','문의일']);
    if(hi<0) throw new Error('헤더(유형·브랜드·문의일) 줄을 찾지 못했어요.');
    const H=rows[hi], C=n=>colIdx(H,n);
    const ix = { done:C(['프로젝트완료','완료']), type:C(['유형']), date:C(['문의일']), brand:C(['브랜드']), cat:C(['카테고리']),
      product:C(['제품명']), route:C(['문의경로']), channel:C(['업로드채널']), platform:C(['요청플랫폼']), hope:C(['희망일정']),
      status:C(['소통현황']), confirm:C(['진행확정']), settle:C(['정산일정']), price:C(['진행단가','단가']), contact:C(['담당자']), memo:C(['비고']) };
    const items=[];
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i], g=k=> ix[k]>=0 ? clean(r[ix[k]]) : '';
      // 체크박스(TRUE/FALSE)만 있는 빈 줄은 제외
      if(!r.some(c=>{ const v=clean(c); return v && !/^(true|false)$/i.test(v); })) continue;
      items.push({ row:i+1, done:/^true$/i.test(g('done')), type:g('type'), dateRaw:g('date'), date:parseDate(g('date')),
        brand:g('brand'), cat:g('cat'), product:g('product'), route:g('route'), channel:g('channel'), platform:g('platform'),
        hope:g('hope'), status:g('status'), confirm:g('confirm'), settle:g('settle'), priceRaw:g('price'), price:parseNum(g('price')),
        contact:g('contact'), memo:g('memo') });
    }
    // 중복 의심(같은 날짜·브랜드·유형·제품)
    const seen=new Map(); const dups=[];
    items.forEach(it=>{
      const k=[it.dateRaw,norm(it.brand),it.type,norm(it.product)].join('|');
      if(seen.has(k)){ it.dup=true; dups.push(it); } else seen.set(k,it);
    });
    return { items, dups };
  },

  /* --- 광고 진행 확정건 (매출) --- */
  confirmed(rows){
    const hi = findHeader(rows,['브랜드','업로드일']);
    if(hi<0) throw new Error('헤더(브랜드·업로드일) 줄을 찾지 못했어요.');
    const H=rows[hi], C=n=>colIdx(H,n);
    // 헤더 칸에 들어있는 여러 줄 메모(예: [진행불가 항목])는 데이터가 아니라 안내문
    const notes = H.map(clean).filter(v=>v.includes('\n') || /^\[.*\]/.test(v));
    const ix = { type:C(['유형']), date:C(['문의일']), brand:C(['브랜드']), agency:C(['대행사']), cat:C(['카테고리']),
      product:C(['제품명']), link:C(['업로드채널']), platform:C(['요청플랫폼']), upload:C(['업로드일']), price:C(['진행단가','단가']),
      contract:C(['계약서']), keep:C(['게시물유지기간','유지기간']), reuse:C(['2차활용']) };
    const items=[];
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i], g=k=> ix[k]>=0 ? clean(r[ix[k]]) : '';
      if(!g('brand')) continue;
      const up=parseDate(g('upload')), inq=parseDate(g('date'));
      items.push({ row:i+1, type:g('type'), inqRaw:g('date'), inq, brand:g('brand'), agency:g('agency'), cat:g('cat'),
        product:g('product'), link:g('link'), platform:g('platform'), uploadRaw:g('upload'), up,
        priceRaw:g('price'), amount:parseNum(g('price')), contract:g('contract'), keep:g('keep'), reuse:g('reuse'),
        rev: up || inq });
    }
    return { items, notes };
  },

  /* --- 월별 인게이지먼트 (크리에이터 × 지표 × 월) --- */
  engagement(rows){
    const hi = findHeader(rows,['구분']);
    if(hi<0) throw new Error('헤더(구분) 줄을 찾지 못했어요.');
    const H=rows[hi];
    const months=[]; H.forEach((h,j)=>{ const m=clean(h).match(/^(\d{1,2})\s*월$/); if(m) months.push({j,m:+m[1]}); });
    const cumCol=colIdx(H,['누적']), metCol=colIdx(H,['구분']);
    let crCol=colIdx(H,['크리에이터']); if(crCol<0) crCol=0;
    const creators=new Map(); let cur='';
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i];
      const c=clean(r[crCol]); if(c) cur=c;               // 병합 셀: 위쪽 이름을 아래로 채움
      const name=clean(r[metCol]); if(!name) continue;
      const vals=months.map(mc=>({ m:mc.m, raw:clean(r[mc.j]), v:parseNum(r[mc.j]) }));
      const isText = vals.some(v=>v.raw && v.v===null);
      const metric={ name, cumRaw: cumCol>=0?clean(r[cumCol]):'', cum: cumCol>=0?parseNum(r[cumCol]):null,
        vals, isText, stock:/구독자|팔로워/.test(name) };
      const key=cur||'(이름 없음)';
      if(!creators.has(key)) creators.set(key,[]);
      creators.get(key).push(metric);
    }
    return { creators, months:months.map(m=>m.m) };
  }
};

/* CSV 내용으로 어떤 시트인지 자동 판별 (직접 업로드용) */
function detectKind(text){
  if(/\d+\s*월\s*스케줄/.test(text)) return 'schedule';
  if(/광고확정|계약서/.test(text)) return 'confirmed';
  if(/문의\s*경로|문의\s*현황/.test(text)) return 'inquiry';
  if(/구분/.test(text) && /1월/.test(text)) return 'engagement';
  return null;
}

let SECRET=null;
const state = { data:{}, active:TABS[0].key, lastUpdated:null, loading:false, ui:{ q:'', type:'', ym:'', creator:'' } };

async function deriveAndDecrypt(pw){
  if(!window.crypto || !crypto.subtle) throw new Error('이 브라우저(또는 http 주소)에서는 암호 해제를 지원하지 않아요. https 주소로 접속해 주세요.');
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(CONFIG.salt),iterations:CONFIG.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CONFIG.iv)},key,b64(CONFIG.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

function ingest(key, text, source){
  const parsed = PARSERS[key](parseCSV(text));
  state.data[key] = { status:'ok', parsed, source, at:new Date(), rows:parseCSV(text).length };
}

async function loadSheet(key){
  const url = SECRET?.sheets?.[key];
  const prev = state.data[key];
  if(!url){ state.data[key]={status:'error', error:'설정에 이 시트의 CSV 링크가 없어요.'}; return; }
  try{
    const u = url + (url.includes('?')?'&':'?') + '_ts=' + Date.now();   // 캐시 우회
    const res = await fetch(u, { cache:'no-store' });
    if(!res.ok) throw new Error(`서버 응답 오류 (HTTP ${res.status})`);
    const text = decodeBuffer(await res.arrayBuffer());
    if(/^\s*<(!doctype|html)/i.test(text)) throw new Error('CSV 대신 웹페이지가 돌아왔어요. 구글 시트에서 "웹에 게시 → CSV"가 켜져 있는지 확인해 주세요.');
    try{ ingest(key, text, 'sheet'); }
    catch(e){ throw new Error('CSV 형식을 해석하지 못했어요: '+e.message); }
  }catch(e){
    const msg = (e instanceof TypeError)
      ? 'CSV를 불러오지 못했어요. 인터넷 연결 또는 브라우저 보안 정책(CORS) 문제일 수 있어요.'
      : e.message;
    console.error('['+key+']', e);
    if(prev && prev.parsed) state.data[key] = {...prev, stale:true, error:msg};   // 기존 데이터 유지
    else state.data[key] = { status:'error', error:msg };
  }
}

async function loadAll(){
  if(state.loading) return;
  state.loading=true; $('#refreshBtn').classList.add('spin'); updateMeta();
  await Promise.all(TABS.map(t=>loadSheet(t.key)));
  state.loading=false; state.lastUpdated=new Date(); $('#refreshBtn').classList.remove('spin');
  renderTabs(); render(); updateMeta();
}

function updateMeta(){
  const el=$('#meta');
  if(state.loading){ el.textContent='최신 데이터 불러오는 중…'; return; }
  if(!state.lastUpdated){ el.textContent=''; return; }
  const t=state.lastUpdated;
  el.textContent=`마지막 업데이트 ${p2(t.getHours())}:${p2(t.getMinutes())}:${p2(t.getSeconds())} · ${AUTO_REFRESH_MIN}분마다 자동 갱신`;
}

/* 직접 업로드 */
async function handleFiles(files, forcedKey){
  const msgs=[];
  for(const f of files){
    const text = decodeBuffer(await f.arrayBuffer());
    const key = forcedKey || detectKind(text);
    if(!key){ msgs.push(`"${f.name}": 어떤 시트인지 알 수 없어요.`); continue; }
    try{ ingest(key,text,'upload'); state.data[key].fileName=f.name; }
    catch(e){ msgs.push(`"${f.name}": ${e.message}`); }
  }
  renderTabs(); render();
  if(msgs.length) alertBox(msgs.join('\n'));
}
function alertBox(msg){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h4>알림</h4><div style="white-space:pre-line;font-size:14px">${esc(msg)}</div><button class="btn-primary" style="height:44px">확인</button></div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg||e.target.tagName==='BUTTON') bg.remove(); });
  document.body.appendChild(bg);
}

function legendHTML(items){ return `<div class="legend">${items.map(i=>`<span><i class="${i.line?'line':''}" style="background:${i.color}"></i>${esc(i.label)}</span>`).join('')}</div>`; }
const noChartLib = () => '';
function niceTicks(min,max,n=5){
  if(max===min){ max = min===0 ? 1 : min*1.1; }
  const raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), r=raw/mag;
  const step=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo; v<=hi+step/2; v+=step) t.push(+v.toFixed(10));
  return t;
}
/* o = { labels, series:[{label,data,color,type:'bar'|'line'}], stacked, horizontal, beginAtZero, intOnly, fmt(축), tip(값) } */
function drawChart(id, o){
  const el=document.getElementById(id); if(!el) return;
  const fmtAxis=o.fmt||numShort, fmtTip=o.tip||(v=>fmt(v));
  const render=()=>{
    const W=el.clientWidth, H=el.clientHeight; if(!W||!H) return;
    const L=o.labels, n=L.length, S=o.series;
    const bars=S.filter(s=>(s.type||'bar')==='bar'), lines=S.filter(s=>s.type==='line');
    let vals=[];
    if(o.stacked) L.forEach((_,i)=>vals.push(bars.reduce((a,s)=>a+(s.data[i]||0),0)));
    else bars.forEach(s=>vals.push(...s.data.filter(v=>v!=null)));
    lines.forEach(s=>vals.push(...s.data.filter(v=>v!=null)));
    if(!vals.length) vals=[0];
    let mn=Math.min(...vals), mx=Math.max(...vals);
    if(o.beginAtZero!==false || bars.length) mn=Math.min(0,mn); else { const pad=(mx-mn)*0.25||Math.abs(mx)*0.02||1; mn-=pad; mx+=pad; }
    let ticks=niceTicks(mn,mx,o.horizontal?4:5); if(o.intOnly) ticks=ticks.filter(t=>Number.isInteger(t));
    if(ticks.length<2) ticks=[0,1];
    const t0=ticks[0], t1=ticks[ticks.length-1];
    let svg='', hits='';
    if(!o.horizontal){
      const pl=Math.max(...ticks.map(t=>fmtAxis(t).length))*7+14, pr=12, pt=12, pb=28;
      const pw=W-pl-pr, ph=H-pt-pb, band=pw/n;
      const y=v=>pt+ph-(v-t0)/(t1-t0)*ph;
      ticks.forEach(t=>{ svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" class="ax">${esc(fmtAxis(t))}</text>`; });
      const every=Math.ceil(36/band);
      L.forEach((lb,i)=>{ if(i%every===0) svg+=`<text x="${pl+band*i+band/2}" y="${H-8}" text-anchor="middle" class="ax">${esc(lb)}</text>`; });
      const slots=o.stacked?1:bars.length||1, bw=Math.min(o.maxBar||40, band*0.72/slots);
      L.forEach((_,i)=>{
        let acc=0; const cx=pl+band*i+band/2;
        const top=o.stacked ? bars.map((s,k)=>(s.data[i]||0)>0?k:-1).filter(k=>k>=0).pop() : null;
        bars.forEach((s,k)=>{
          const v=s.data[i]; if(v==null||v===0) return;
          const x = o.stacked ? cx-bw/2 : cx-(bw*slots)/2+bw*k;
          const base = o.stacked?acc:0, yv=y(base+v), yb=y(base); acc+= o.stacked?v:0;
          const hgt=Math.max(1, yb-yv-(o.stacked&&k>0&&base>0?2:0)), r=Math.min(4,bw/2,hgt);
          const round = !o.stacked || k===top;
          const w=Math.max(1,bw-(o.stacked?0:2));
          svg += round
            ? `<path d="M${x},${yv+hgt} V${yv+r} Q${x},${yv} ${x+r},${yv} H${x+w-r} Q${x+w},${yv} ${x+w},${yv+r} V${yv+hgt} Z" fill="${s.color}"/>`
            : `<rect x="${x}" y="${yv}" width="${w}" height="${hgt}" fill="${s.color}"/>`;
        });
      });
      lines.forEach(s=>{
        const pts=s.data.map((v,i)=>v==null?null:[pl+band*i+band/2, y(v)]).filter(Boolean);
        if(pts.length>1) svg+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
        pts.forEach(p=>{ svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="${s.color}" stroke-width="2"/>`; });
      });
      L.forEach((_,i)=>{ hits+=`<rect class="hit" data-i="${i}" x="${pl+band*i}" y="${pt}" width="${band}" height="${ph}" fill="transparent"/>`; });
    } else {
      const maxLab=Math.max(...L.map(l=>String(l).length));
      const pl=Math.min(W*0.42, maxLab*12.5+12), pr=56, pt=4, pb=24;
      const pw=W-pl-pr, ph=H-pt-pb, band=ph/n, bh=Math.min(o.maxBar||22, band*0.68);
      const x=v=>pl+(v-t0)/(t1-t0)*pw;
      ticks.forEach(t=>{ svg+=`<line x1="${x(t)}" x2="${x(t)}" y1="${pt}" y2="${pt+ph}" stroke="var(--grid)"/><text x="${x(t)}" y="${H-6}" text-anchor="middle" class="ax">${esc(fmtAxis(t))}</text>`; });
      const s=bars[0];
      L.forEach((lb,i)=>{
        const cy=pt+band*i+band/2, v=s.data[i]||0, x1=x(0), x2=x(v), w=Math.max(1,x2-x1), r=Math.min(4,bh/2,w);
        const short = String(lb).length>maxLab ? lb : lb;
        svg+=`<text x="${pl-8}" y="${cy+4}" text-anchor="end" class="ax lab">${esc(short)}</text>`;
        svg+=`<path d="M${x1},${cy-bh/2} H${x1+w-r} Q${x1+w},${cy-bh/2} ${x1+w},${cy-bh/2+r} V${cy+bh/2-r} Q${x1+w},${cy+bh/2} ${x1+w-r},${cy+bh/2} H${x1} Z" fill="${s.color}"/>`;
        svg+=`<text x="${x1+w+6}" y="${cy+4}" class="ax val">${esc(fmtAxis(v))}</text>`;
        hits+=`<rect class="hit" data-i="${i}" x="0" y="${pt+band*i}" width="${W}" height="${band}" fill="transparent"/>`;
      });
    }
    el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'차트')}">${svg}<rect class="hl" fill="var(--accent)" opacity="0" />${hits}</svg><div class="tip"></div>`;
    const tip=el.querySelector('.tip'), hl=el.querySelector('.hl');
    const show=(e,i,r)=>{
      const rows=S.map(s=>({s,v:s.data[i]})).filter(x=>!(o.hideZero && !x.v));
      const total = o.stacked ? `<div class="tip-f">합계 ${esc(fmtTip(bars.reduce((a,s)=>a+(s.data[i]||0),0)))}</div>` : '';
      tip.innerHTML=`<div class="tip-t">${esc(L[i])}</div>${rows.map(x=>`<div class="tip-r"><i style="background:${x.s.color}"></i>${esc(x.s.label)}<b>${x.v==null?'값 없음':esc(fmtTip(x.v))}</b></div>`).join('')||'<div class="tip-r">값 없음</div>'}${total}`;
      tip.style.display='block';
      ['x','y','width','height'].forEach(a=>hl.setAttribute(a,r.getAttribute(a))); hl.setAttribute('opacity','0.06');
      const b=el.getBoundingClientRect(), px=e.clientX-b.left, py=e.clientY-b.top, tw=tip.offsetWidth, th=tip.offsetHeight;
      tip.style.left=Math.max(0,Math.min(W-tw, px+14>W-tw?px-tw-14:px+14))+'px';
      tip.style.top=Math.max(0,Math.min(H-th, py-th/2))+'px';
    };
    el.querySelectorAll('.hit').forEach(r=>{
      r.addEventListener('pointermove',e=>show(e,+r.dataset.i,r));
      r.addEventListener('pointerdown',e=>show(e,+r.dataset.i,r));
    });
    el.querySelector('svg').addEventListener('pointerleave',()=>{ tip.style.display='none'; hl.setAttribute('opacity','0'); });
  };
  const ro=new ResizeObserver(()=>render()); ro.observe(el);
  charts.push({destroy:()=>ro.disconnect()});
}

/* 문의 유형 → 고정 색 (색은 순위가 아니라 항목을 따라감) */
const TYPE_ORDER=['선제안','광고(PPL)','공구마켓','단순선물'];
const typeColor = t => { const i=TYPE_ORDER.indexOf(t); return i>=0 ? `var(--s${i+1})` : 'var(--neutral)'; };
const typeName = t => t || '유형 미기재';

/* =====================================================================
   ⑥ 탭별 화면
   ===================================================================== */
const VIEWS={}, AFTER={};

/* ---------- 1. 광고 스케줄 (메인) ---------- */
VIEWS.schedule = P => {
  const T=todayDate(); const ev=P.events;
  const all=[...ev.entries()].map(([k,list])=>({k,list,t:new Date(k).getTime()})).sort((a,b)=>a.k<b.k?-1:1);
  const count = arr => arr.reduce((s,e)=>s+e.list.length,0);
  const thisMonth = all.filter(e=>e.k.startsWith(T.ym));
  const in7 = all.filter(e=>{ const diff=(new Date(e.k)-new Date(T.key))/864e5; return diff>=0 && diff<7; });
  const upcoming = all.filter(e=>e.k>=T.key);
  const next = upcoming[0];
  const b0=P.blocks[0], bN=P.blocks[P.blocks.length-1];
  const period = `${b0.year}.${p2(b0.month)} – ${bN.year}.${p2(bN.month)}`;
  const dd = k => { const [y,m,d]=k.split('-').map(Number); return {m,d,dow:DOW[new Date(y,m-1,d).getDay()]}; };
  const rel = k => { const n=Math.round((new Date(k)-new Date(T.key))/864e5); return n===0?'오늘':n===1?'내일':n>0?`D-${n}`:`${-n}일 전`; };

  let h = head('광고 스케줄', `${period} · ${P.blocks.length}개월 일정`);
  P.notes.forEach(n=>{ h+=`<div class="notice">${ICON_INFO}<div class="grow">${esc(n)}</div></div>`; });
  h += `<div class="kpis">
    ${kpi({label:'이번 달 일정', value:count(thisMonth), unit:'건', foot:`${T.m}월 기준`, hero:true})}
    ${kpi({label:'앞으로 7일', value:count(in7), unit:'건', foot:`${T.m}/${T.d} – 7일간`})}
    ${kpi({label:'다음 일정', value: next ? `${dd(next.k).m}/${dd(next.k).d}` : '없음', foot: next ? `${esc(rel(next.k))} · ${esc(next.list[0])}` : '예정된 일정이 없어요'})}
    ${kpi({label:'전체 등록 일정', value:count(all), unit:'건', foot:`관리 기간 ${period}`})}
  </div>`;

  h += `<div class="grid g3"><div class="card"><div class="card-h"><h3>다가오는 일정</h3><span class="hint">오늘 이후 최대 8건</span></div>`;
  h += upcoming.length ? `<ul class="up-list">${upcoming.slice(0,8).map(e=>{ const x=dd(e.k); return `<li><div class="up-date"><b class="num">${x.d}</b><span>${x.m}월 ${x.dow}</span></div><div class="up-txt"><span class="rel">${esc(rel(e.k))}</span>${esc(e.list.join('\n'))}</div></li>`; }).join('')}</ul>`
    : `<div class="empty">아직 등록된 일정이 없어요.<br>구글 시트의 달력 칸(날짜 아래 2줄)에 일정을 입력하면 여기에 자동으로 나타나요.</div>`;
  h += `</div><div class="card"><div class="card-h"><h3>월별 일정 수</h3></div><ul class="ratio-list">${P.blocks.map(b=>{
      const ym=`${b.year}-${p2(b.month)}`; const n=count(all.filter(e=>e.k.startsWith(ym)));
      return `<li><i style="background:var(--accent)"></i>${b.year!==T.y?`${String(b.year).slice(2)}년 `:''}${b.month}월<span class="n num">${n}건</span></li>`; }).join('')}</ul>
      <div class="count-line" style="margin-top:14px">날짜 칸을 누르면 그날 일정을 크게 볼 수 있어요.</div></div></div>`;

  h += `<div class="cal-wrap">${P.blocks.map(b=>{
    const ym=`${b.year}-${p2(b.month)}`; const n=count(all.filter(e=>e.k.startsWith(ym)));
    return `<div class="card cal"><h3>${b.month}월 <span class="yr">${b.year}</span><span class="cnt">${n}건</span></h3><div class="cal-grid">
      ${DOW.map((d,i)=>`<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('')}
      ${b.weeks.flat().map(c=>{
        if(!c) return '<div></div>';
        const list=ev.get(c.key)||[];
        const cls=['cal-cell', c.inMonth?'':'out', c.key===T.key?'today':'', list.length?'has':'', c.dow===0?'sun':c.dow===6?'sat':''].join(' ');
        return `<div class="${cls}" ${list.length?`data-day="${c.key}"`:''} title="${esc(list.join('\n'))}"><span class="d num">${c.d}</span>
          ${list.slice(0,2).map(t=>`<div class="ev">${esc(t)}</div>`).join('')}${list.length>2?`<div class="ev-more">+${list.length-2}</div>`:''}</div>`;
      }).join('')}</div></div>`;
  }).join('')}</div>`;

  h += `<details class="verify"><summary>🔍 데이터 해석 확인</summary><ul class="v-list">
    <li><span class="ok">✓</span>달력 ${P.blocks.length}개월 인식: ${P.blocks.map(b=>`${b.year}년 ${b.month}월`).join(', ')}</li>
    <li><span class="ok">✓</span>날짜 칸 ${P.dateCells}개 인식 (월이 겹치는 날짜는 같은 날로 합쳐 표시)</li>
    <li><span class="ok">✓</span>입력된 일정 ${count(all)}건 / 일정이 있는 날 ${all.length}일</li>
    <li><span class="wn">!</span>시트에 연도가 없어 오늘 날짜 기준으로 연도를 추정했어요 (12월 → 1월로 넘어가면 다음 해).</li>
  </ul></details>`;
  return h;
};
AFTER.schedule = P => {
  document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.day, [y,m,d]=k.split('-').map(Number);
    const list=P.events.get(k)||[];
    alertBox(`${y}년 ${m}월 ${d}일 (${DOW[new Date(y,m-1,d).getDay()]})\n\n• ${list.join('\n• ')}`);

};

/* ---------- 2. 광고 문의 ---------- */
VIEWS.inquiry = P => {
  const T=todayDate(), items=P.items;
  const byType = new Map(); items.forEach(i=>byType.set(typeName(i.type),(byType.get(typeName(i.type))||0)+1));
  const types=[...byType.keys()].sort((a,b)=>{ const ia=TYPE_ORDER.indexOf(a), ib=TYPE_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  const dated=items.filter(i=>i.date), undated=items.filter(i=>!i.date);
  const thisM=dated.filter(i=>i.date.ym===T.ym).length, lastM=dated.filter(i=>i.date.ym===ymAdd(T.ym,-1)).length;
  const sumTypes=[...byType.values()].reduce((a,b)=>a+b,0);
  const cnt=t=>byType.get(t)||0;

  let h = head('광고 문의', `전체 ${fmt(items.length)}건 · 브랜드 문의 및 선제안 현황`);
  h += `<div class="kpis">
    ${kpi({label:'총 문의', value:fmt(items.length), unit:'건', hero:true, foot:`날짜 기재 ${dated.length}건 · 미기재 ${undated.length}건`})}
    ${kpi({label:`이번 달 (${T.m}월)`, value:fmt(thisM), unit:'건', foot:`지난달 ${lastM}건 ${delta(thisM,lastM,'건')}`})}
    ${kpi({label:'광고(PPL)', value:fmt(cnt('광고(PPL)')), unit:'건', dot:typeColor('광고(PPL)'), foot:`전체의 ${items.length?Math.round(cnt('광고(PPL)')/items.length*100):0}%`})}
    ${kpi({label:'공구마켓', value:fmt(cnt('공구마켓')), unit:'건', dot:typeColor('공구마켓'), foot:`선제안 ${cnt('선제안')}건 · 단순선물 ${cnt('단순선물')}건`})}
  </div>`;
  h += noChartLib();
  h += `<div class="grid g3">
    <div class="card"><div class="card-h"><h3>월별 문의 추이</h3><span class="hint">유형별 누적 · 날짜 미기재 ${undated.length}건 제외</span></div>
      ${legendHTML(types.map(t=>({label:t,color:typeColor(t)})))}<div class="chart"><div id="cInqMonth" class="plot"></div></div></div>
    <div class="card"><div class="card-h"><h3>유형 비율</h3><span class="hint">${fmt(items.length)}건</span></div>
      <div class="ratio">${types.map(t=>`<div style="width:${cnt(t)/items.length*100}%;background:${typeColor(t)}" title="${esc(t)} ${cnt(t)}건"></div>`).join('')}</div>
      <ul class="ratio-list">${types.map(t=>`<li><i style="background:${typeColor(t)}"></i>${esc(t)}<span class="n num">${cnt(t)}건</span><span class="p num">${(cnt(t)/items.length*100).toFixed(1)}%</span></li>`).join('')}</ul></div>
  </div>`;
  h += `<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>카테고리 Top 10</h3><span class="hint">시트 카테고리 칸 기준 · 빈 칸은 '미기재'</span></div><div class="chart tall"><div id="cInqCat" class="plot"></div></div></div>`;

  const yms=[...new Set(dated.map(i=>i.date.ym))].sort().reverse();
  h += `<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>문의 목록</h3><span class="hint">최신순</span></div>
    <div class="toolbar">
      <input id="fQ" type="search" placeholder="브랜드·제품·카테고리 검색" value="${esc(state.ui.q)}">
      <select id="fType"><option value="">전체 유형</option>${types.map(t=>`<option ${state.ui.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <select id="fYm"><option value="">전체 기간</option>${yms.map(y=>`<option value="${y}" ${state.ui.ym===y?'selected':''}>${y.replace('-','년 ')}월</option>`).join('')}<option value="none" ${state.ui.ym==='none'?'selected':''}>날짜 미기재</option></select>
    </div>
    <div class="table-wrap"><table><thead><tr><th>문의일</th><th>유형</th><th>브랜드</th><th>카테고리</th><th>제품명</th><th>채널</th><th>소통 현황</th><th class="r">단가</th></tr></thead><tbody id="inqBody"></tbody></table></div>
    <div class="count-line" id="inqCount"></div></div>`;

  const monthSum = dated.length;
  h += `<details class="verify"><summary>🔍 계산 검증</summary><ul class="v-list">
    <li><span class="${sumTypes===items.length?'ok':'ng'}">${sumTypes===items.length?'✓':'✗'}</span>유형별 합계 ${sumTypes}건 = 전체 행 ${items.length}건</li>
    <li><span class="${monthSum+undated.length===items.length?'ok':'ng'}">${monthSum+undated.length===items.length?'✓':'✗'}</span>월별 합계 ${monthSum}건 + 날짜 미기재 ${undated.length}건 = 전체 ${items.length}건</li>
    ${undated.length?`<li><span class="wn">!</span>날짜 미기재 행: ${undated.map(i=>`${esc(i.brand||'(브랜드 없음)')} (시트 ${i.row}행${i.dateRaw?`, "${esc(i.dateRaw)}"`:''})`).join(', ')}</li>`:''}
    ${cnt('유형 미기재')?`<li><span class="wn">!</span>유형 미기재 ${cnt('유형 미기재')}건: ${items.filter(i=>!i.type).map(i=>`${esc(i.brand)} (${i.row}행)`).join(', ')}</li>`:''}
    ${P.dups.length?`<li><span class="wn">!</span>중복 의심 ${P.dups.length}건 (합계에는 포함): ${P.dups.map(i=>`${esc(i.brand)} ${esc(i.dateRaw)} (${i.row}행)`).join(', ')}</li>`:'<li><span class="ok">✓</span>중복 의심 행 없음</li>'}
    <li><span class="ok">✓</span>날짜 형식 자동 통일: 26.1.14 · 26.02.4 · 2026-06-22 → 같은 형식으로 인식</li>
  </ul></details>`;
  return h;
};
AFTER.inquiry = P => {
  const dated=P.items.filter(i=>i.date);
  if(dated.length){
    const yms=dated.map(i=>i.date.ym).sort();
    const T=todayDate();
    let end=yms[yms.length-1]; if(T.ym>end && T.y===+end.slice(0,4)) end=T.ym;
    const range=ymRange(yms[0], end);
    const types=[...new Set(P.items.map(i=>typeName(i.type)))].sort((a,b)=>{ const ia=TYPE_ORDER.indexOf(a), ib=TYPE_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
    drawChart('cInqMonth',{ labels:ymLabels(range), stacked:true, intOnly:true, hideZero:true, fmt:v=>String(v), tip:v=>`${v}건`, aria:'월별 문의 추이',
      series: types.map(t=>({ label:t, color:typeColor(t), data:range.map(ym=>dated.filter(i=>i.date.ym===ym && typeName(i.type)===t).length) })) });
  }
  const catMap=new Map(); P.items.forEach(i=>{ const c=i.cat.trim()||'미기재'; catMap.set(c,(catMap.get(c)||0)+1); });
  const top=[...catMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
  drawChart('cInqCat',{ horizontal:true, intOnly:true, labels:top.map(t=>t[0]), fmt:v=>String(v), tip:v=>`${v}건`, aria:'카테고리 Top 10',
    series:[{ label:'문의 수', color:'var(--s1)', data:top.map(t=>t[1]) }] });

  const draw = () => {
    const q=norm(state.ui.q);
    let list=P.items.filter(i=>{
      if(state.ui.type && typeName(i.type)!==state.ui.type) return false;
      if(state.ui.ym==='none' && i.date) return false;
      if(state.ui.ym && state.ui.ym!=='none' && (!i.date || i.date.ym!==state.ui.ym)) return false;
      if(q && !norm([i.brand,i.product,i.cat,i.status,i.memo,i.channel].join(' ')).includes(q)) return false;
      return true;
    });
    list=list.slice().sort((a,b)=> (b.date?.t||0)-(a.date?.t||0) || b.row-a.row);
    $('#inqBody').innerHTML = list.map(i=>`<tr>
      <td class="num">${i.date?`${i.date.y}.${p2(i.date.m)}.${p2(i.date.d)}`:'<span style="color:var(--muted)">미기재</span>'}</td>
      <td><span class="badge"><i style="background:${typeColor(i.type)}"></i>${esc(typeName(i.type))}</span></td>
      <td><b>${esc(i.brand)}</b>${i.dup?'<span class="tag">중복?</span>':''}</td>
      <td>${esc(i.cat)}</td><td class="wrap">${esc(i.product)}</td><td>${esc(i.channel)}</td><td class="wrap">${esc(i.status)}</td>
      <td class="r num">${i.price!=null?won(i.price):esc(i.priceRaw)}</td></tr>`).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:28px">조건에 맞는 문의가 없어요</td></tr>`;

/* ---------- 3. 광고 확정 · 매출 ---------- */
function revenueSeries(P){
  const T=todayDate();
  const withM=P.items.filter(i=>i.rev && i.amount!=null);
  if(!withM.length) return {range:[],monthly:[],cum:[]};
  const yms=withM.map(i=>i.rev.ym).sort();
  let start=`${yms[0].slice(0,4)}-01`; let end=yms[yms.length-1]; if(T.ym>end) end=T.ym;
  let range=ymRange(start,end); if(range.length>24) range=range.slice(-24);
  const monthly=range.map(ym=>withM.filter(i=>i.rev.ym===ym).reduce((s,i)=>s+i.amount,0));
  let acc=0; const cum=monthly.map(v=>acc+=v);
  return {range, monthly, cum, counts:range.map(ym=>withM.filter(i=>i.rev.ym===ym).length)};
}

    ${kpi({label:'확정 건수', value:items.length, unit:'건', foot: futures?`업로드 예정 ${futures}건`:'모두 업로드 완료'})}
    ${kpi({label:'평균 단가', value:wonShort(avg), unit:'원', foot: avg!=null?won(avg):''})}
    ${kpi({label:'최근 업로드', value: latest?`${latest.up.m}/${latest.up.d}`:'–', foot: latest?esc(latest.brand)+` · 이번 달 매출 ${wonShort(thisM)}원`:''})}
  </div>`;
  P.notes.forEach(n=>{ h+=`<div class="notice warn">${ICON_WARN}<div class="grow">${esc(n)}</div></div>`; });

  h += `<div class="grid g2">
    <div class="card"><div class="card-h"><h3>월별 매출표</h3><span class="hint">원본 대조용</span></div>
      <div class="table-wrap"><table><thead><tr><th>월</th><th class="r">건수</th><th class="r">월 매출</th><th class="r">누적 매출</th></tr></thead><tbody>
      ${S.range.map((ym,i)=>`<tr><td>${ym.replace('-','.')}</td><td class="r num">${S.counts[i]}</td><td class="r num">${won(S.monthly[i])}</td><td class="r num">${won(S.cum[i])}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>합계</td><td class="r num">${S.counts.reduce((a,b)=>a+b,0)}</td><td class="r num">${won(S.monthly.reduce((a,b)=>a+b,0))}</td><td class="r num">${won(S.cum[S.cum.length-1])}</td></tr></tfoot></table></div></div>
    <div class="card"><div class="card-h"><h3>카테고리별 매출</h3></div><div class="chart"><div id="cRevCat" class="plot"></div></div></div>
  </div>`;
  h += `<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>확정 광고 목록</h3><span class="hint">최신 업로드순</span></div>
    ${items.length?`<div class="deals">${items.slice().sort((a,b)=>(b.up?.t||0)-(a.up?.t||0)).map(i=>`<div class="deal">
      <div class="top"><div><div class="b">${esc(i.brand)}</div><div class="p">${esc(i.product)}</div></div><div class="amt num">${i.amount!=null?wonShort(i.amount)+'원':esc(i.priceRaw||'금액 미정')}</div></div>
      <div class="chips">${[i.type,i.cat,i.platform,i.agency&&`대행 ${i.agency}`,i.keep&&`유지 ${i.keep}`,i.reuse&&`2차활용 ${i.reuse}`].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>

    </div>`).join('')}</div>`:'<div class="empty">아직 확정된 광고가 없어요.</div>'}</div>`;
  const sumMonthly=S.monthly.reduce((a,b)=>a+b,0);
  const noMonth=valid.filter(i=>!i.rev);
  h += `<details class="verify"><summary>🔍 계산 검증</summary><ul class="v-list">
    <li><span class="ok">✓</span>행별 단가 합계: ${valid.map(i=>wonShort(i.amount)).join(' + ')||'0'} = <b>${won(total)}</b></li>
    <li><span class="${sumMonthly+noMonth.reduce((s,i)=>s+i.amount,0)===total?'ok':'ng'}">${sumMonthly+noMonth.reduce((s,i)=>s+i.amount,0)===total?'✓':'✗'}</span>월별 매출 합계 ${won(sumMonthly)}${noMonth.length?` + 날짜 없음 ${won(noMonth.reduce((s,i)=>s+i.amount,0))}`:''} = 총 매출 ${won(total)}</li>
    <li><span class="${S.cum[S.cum.length-1]===sumMonthly?'ok':'ng'}">${S.cum[S.cum.length-1]===sumMonthly?'✓':'✗'}</span>누적 매출 마지막 값 ${won(S.cum[S.cum.length-1])} = 월별 합계</li>
    ${invalid.length?`<li><span class="wn">!</span>금액을 숫자로 인식하지 못한 행 ${invalid.length}건 (합계 제외): ${invalid.map(i=>`${esc(i.brand)} "${esc(i.priceRaw)}" (${i.row}행)`).join(', ')}</li>`:'<li><span class="ok">✓</span>모든 행의 금액 인식 성공 ("₩10,000,000" → 10000000)</li>'}

/* ---------- 4. 인게이지먼트 ---------- */
const platformOf = n => /YT|유튜브|youtube/i.test(n) ? 'YT' : /IG|인스타|instagram/i.test(n) ? 'IG' : 'ETC';
const metricColor = (n,i) => /구독자/.test(n) ? 'var(--s2)' : /팔로워/.test(n) ? 'var(--s1)' : /롱폼/.test(n) ? 'var(--s2)' : /숏폼/.test(n) ? 'var(--s3)' : platformOf(n)==='IG' ? 'var(--s1)' : `var(--s${(i%8)+1})`;
function lastVals(m){ const nn=m.vals.filter(v=>v.v!=null); return { last:nn[nn.length-1], prev:nn[nn.length-2] }; }

VIEWS.engagement = P => {
  const names=[...P.creators.keys()];
  if(!state.ui.creator || !P.creators.has(state.ui.creator)) state.ui.creator=names[0];
  const ms=P.creators.get(state.ui.creator)||[];
  const num=ms.filter(m=>!m.isText), txt=ms.filter(m=>m.isText);
  const stock=num.filter(m=>m.stock), flow=num.filter(m=>!m.stock);
  const lastM=Math.max(0,...num.flatMap(m=>m.vals.filter(v=>v.v!=null).map(v=>v.m)));
  const sumFlow = arr => arr.reduce((s,m)=>s+m.vals.reduce((a,v)=>a+(v.v||0),0),0);
  const yt=flow.filter(m=>platformOf(m.name)==='YT'), ig=flow.filter(m=>platformOf(m.name)==='IG'), etc=flow.filter(m=>platformOf(m.name)==='ETC');

  let h = head('월별 인게이지먼트', `${esc(state.ui.creator)} · ${lastM?`1월 – ${lastM}월 데이터`:'데이터 없음'}`);
  if(names.length>1) h += `<div class="toolbar"><select id="fCreator">${names.map(n=>`<option ${n===state.ui.creator?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
  const cards=[];
  stock.forEach((m,i)=>{ const {last,prev}=lastVals(m);
    cards.push(kpi({label:m.name, value:last?fmt(last.v):'–', unit:'명', dot:metricColor(m.name,i), hero:i===0, title:last?fmt(last.v):'',
      foot: last?`${last.m}월 기준 ${prev?delta(last.v,prev.v,'')+` <span>vs ${prev.m}월</span>`:''}`:'' })); });
  if(yt.length) cards.push(kpi({label:'YT 총 조회수', value:fmt(sumFlow(yt)), unit:'회', dot:'var(--s2)', title:fmt(sumFlow(yt)), foot:yt.map(m=>`${m.name.replace(/^YT\s*/,'')} ${numShort(sumFlow([m]))}`).join(' · ')}));
  if(ig.length) cards.push(kpi({label:ig.length===1?ig[0].name:'IG 총 조회수', value:fmt(sumFlow(ig)), unit:'회', dot:'var(--s1)', title:fmt(sumFlow(ig)), foot:`1월 – ${lastM}월 합계`}));
  h += `<div class="kpis">${cards.slice(0,8).join('')}</div>`;
  const infos=[...etc, ...txt];
  if(infos.length) h += `<div class="notice">${ICON_INFO}<div class="grow">${infos.map(m=>`<b>${esc(m.name)}</b>${m.vals.filter(v=>v.raw).map(v=>`${v.m}월: ${esc(v.v!=null?fmt(v.v):v.raw)}`).join(' · ')||'기재된 값 없음'}`).join('<div style="height:8px"></div>')}</div></div>`;
  h += noChartLib();
  h += `<div class="grid g2">
    ${stock.length?`<div class="card"><div class="card-h"><h3>구독자 · 팔로워 추이</h3><span class="hint">월말 기준 인원</span></div>${legendHTML(stock.map((m,i)=>({label:m.name,color:metricColor(m.name,i),line:true})))}<div class="chart"><div id="cStock" class="plot"></div></div></div>`:''}
    ${yt.length?`<div class="card"><div class="card-h"><h3>YouTube 월별 조회수</h3></div>${legendHTML(yt.map((m,i)=>({label:m.name,color:metricColor(m.name,i)})))}<div class="chart"><div id="cYT" class="plot"></div></div></div>`:''}
  </div>
    ${ig.length?`<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Instagram 월별 조회수</h3><span class="hint">빈 달은 시트에 값 없음</span></div><div class="chart"><div id="cIG" class="plot"></div></div></div>`:''}`;
  const show=P.months.filter(m=>m<=Math.max(lastM,1));
  h += `<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>원본 수치표</h3><span class="hint">'–'는 시트의 빈 칸 또는 대시</span></div><div class="table-wrap"><table>
    <thead><tr><th>구분</th><th class="r">누적(시트)</th>${show.map(m=>`<th class="r">${m}월</th>`).join('')}</tr></thead><tbody>
    ${ms.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td class="r num">${esc(m.cumRaw||'–')}</td>${show.map(mm=>{ const v=m.vals.find(x=>x.m===mm); return `<td class="r num">${v&&v.raw?(v.v!=null?fmt(v.v):esc(v.raw)):'–'}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
  h += `<details class="verify"><summary>🔍 계산 검증 (시트 '누적' 열 vs 월별 합계)</summary><ul class="v-list">
    ${num.map(m=>{ const s=m.vals.reduce((a,v)=>a+(v.v||0),0);
      if(m.cum==null) return `<li><span class="wn">–</span>${esc(m.name)}: 시트에 누적 값 없음 (월별 합계 ${fmt(s)})</li>`;
      const ok=Math.round(s)===Math.round(m.cum);
      if(m.stock) return `<li><span class="${ok?'wn':'ng'}">!</span>${esc(m.name)}: 시트 누적 ${fmt(m.cum)} ${ok?'= 월별 인원을 더한 값':'≠ 월별 합계 '+fmt(s)} → 인원 지표는 더하면 의미가 없어 <b style="display:inline">최신값(${fmt(lastVals(m).last?.v)}명)</b>으로 표시했어요.</li>`;
      return `<li><span class="${ok?'ok':'ng'}">${ok?'✓':'✗'}</span>${esc(m.name)}: 시트 누적 ${fmt(m.cum)} ${ok?'=':'≠'} 월별 합계 ${fmt(s)}</li>`; }).join('')}
    <li><span class="ok">✓</span>병합 셀 처리: 크리에이터 이름 '${esc(state.ui.creator)}'을(를) 아래 ${ms.length-1}개 지표 행에 자동 적용</li>
  </ul></details>`;
  return h;
};

async function unlock(pw, silent){
  const btn=$('#gateBtn'); btn.disabled=true; btn.textContent='확인 중…';
  try{
    SECRET = await deriveAndDecrypt(pw);
    store.set('sessionStorage', AUTH_KEY, pw);
    $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
    const h=location.hash.slice(1); if(TABS.some(t=>t.key===h)) state.active=h;
    renderTabs(); render(); loadAll();
    setInterval(loadAll, AUTO_REFRESH_MIN*60*1000);
  }catch(e){
    store.set('sessionStorage', AUTH_KEY, null);
    if(!silent){
      const msg = (e && e.name==='OperationError') ? '비밀번호가 올바르지 않습니다.' : (e.message||'오류가 발생했어요.');
      $('#gateErr').textContent=msg; const c=$('#gateForm'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      $('#pw').select();
    }
  }finally{ btn.disabled=false; btn.textContent='입장하기'; }
}
